<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Very Handy Home Service Inc.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-md p-10 rounded-[40px] shadow-2xl border border-white">
        <!-- Logo/Brand -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-blue-600 tracking-tighter uppercase mb-2">Very Handy</h1>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em]">Home Service Inc.</p>
        </div>

        <div id="loading-view" class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-slate-500 font-medium">Verifying your request...</p>
        </div>

        <div id="reset-view" class="hidden">
            <h2 class="text-2xl font-black text-slate-800 uppercase mb-4 text-center">New Password</h2>
            <p class="text-slate-500 text-sm mb-8 text-center leading-relaxed">
                Please enter a secure new password for your account below.
            </p>

            <form id="form-update-password" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">New
                        Password</label>
                    <input type="password" id="new-password" placeholder="••••••••" required
                        class="w-full px-6 py-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 transition font-medium">
                </div>

                <button type="submit" id="update-btn"
                    class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-700 transition transform hover:-translate-y-1 active:scale-95 uppercase tracking-widest text-sm">
                    Confirm New Password
                </button>
            </form>
        </div>

        <div id="error-view" class="hidden text-center">
            <div class="text-red-500 text-5xl mb-4">⚠️</div>
            <h2 class="text-xl font-black text-slate-800 uppercase mb-2">Invalid or Expired Link</h2>
            <p class="text-slate-500 text-sm mb-8">This password reset link is no longer valid. Please request a new
                one.</p>
            <a href="index.html" class="inline-block text-blue-600 font-bold hover:underline">Back to Home</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kbiiitwgdiwxwazruwny.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiaWlpdHdnZGl3eHdhenJ1d255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwOTQ5OTQsImV4cCI6MjA4MzY3MDk5NH0.vbADZlmwDn80RCghnmo2IE1O1R1gEcnnRha7j1V6VUo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            // Supabase automatically handles the session if the access_token is in the URL fragment
            const { data: { session }, error } = await _supabase.auth.getSession();

            if (session) {
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('reset-view').classList.remove('hidden');
            } else {
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('error-view').classList.remove('hidden');
            }
        }

        document.getElementById('form-update-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('update-btn');
            const originalText = btn.innerText;
            btn.innerText = "UPDATING...";
            btn.disabled = true;

            const newPassword = document.getElementById('new-password').value;

            try {
                const { error } = await _supabase.auth.updateUser({ password: newPassword });
                if (error) throw error;

                alert("Success! Your password has been updated.");
                window.location.href = 'index.html'; // Go back to login
            } catch (err) {
                alert("Update failed: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        init();
    </script>
</body>

</html>
