<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Very Handy Home Service Inc.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }

        .sidebar-link.active {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="glass fixed w-full z-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">V</div>
            <span class="text-xl font-black uppercase tracking-tight text-blue-600">Client Portal</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-greeting" class="text-sm font-medium text-slate-600">Loading profile...</span>
            <div id="profile-info" class="mt-2 text-xs text-slate-500"></div>
            <button onclick="handleLogout()"
                class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="lg:col-span-1">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200">
                <h2 class="text-2xl font-black mb-6">Request Service</h2>
                <form id="request-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Service Type</label>
                        <select id="service-type" onchange="updateServiceHint()"
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Loading services...</option>
                        </select>
                        <p id="service-hint" class="mt-2 text-[10px] text-blue-600 italic font-medium"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Description</label>
                        <textarea id="service-desc" rows="4" placeholder="Describe what needs fixing..."
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Nearest Branch</label>
                        <select id="service-branch"
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Loading branches...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Service Address</label>
                        <input id="service-address" type="text" placeholder="Where do we need to go?"
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Preferred Date &
                            Time</label>
                        <input id="service-datetime" type="datetime-local"
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Photo of the Problem
                            (Optional)</label>
                        <input id="service-photo" type="file" accept="image/*" multiple
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                    </div>
                    <button type="submit" id="btn-submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                        Submit Request
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-8">
            <!-- Active Appointments -->
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Active Appointments</h2>
                    <span id="appointment-count"
                        class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-xs font-bold uppercase">0
                        Active</span>
                </div>
                <div id="appointments-container" class="space-y-4">
                    <div class="animate-pulse h-20 bg-slate-100 rounded-2xl"></div>
                </div>
            </div>

            <!-- Service History -->
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-slate-400">Past History</h2>
                    <span id="history-count"
                        class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-xs font-bold uppercase">0
                        Completed</span>
                </div>
                <div id="history-container" class="space-y-4 opacity-75">
                    <div class="animate-pulse h-20 bg-slate-100 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://kbiiitwgdiwxwazruwny.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiaWlpdHdnZGl3eHdhenJ1d255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwOTQ5OTQsImV4cCI6MjA4MzY3MDk5NH0.vbADZlmwDn80RCghnmo2IE1O1R1gEcnnRha7j1V6VUo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // 1. Initial Check
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-greeting').innerText = `Hello, ${currentUser.user_metadata.full_name || currentUser.email}`;
            fetchJobs(); fetchProfile(); fetchBranches(); fetchServices();
        }

        let servicesCache = [];
        async function fetchServices() {
            const { data } = await _supabase.from('services').select('*').order('name');
            servicesCache = data || [];
            const select = document.getElementById('service-type');
            if (data && data.length > 0) {
                select.innerHTML = '<option value="">Select a service</option>' +
                    servicesCache.map(s => `<option value="${s.name}">${s.name}</option>`).join('') +
                    '<option value="Other">Other</option>';
            } else {
                select.innerHTML = '<option value="">No services listed</option><option value="Other">Other</option>';
            }
        }

        function updateServiceHint() {
            const name = document.getElementById('service-type').value;
            const hint = document.getElementById('service-hint');
            const service = servicesCache.find(s => s.name === name);
            hint.innerText = service && service.description ? `💡 ${service.description}` : '';
        }

        async function fetchBranches() {
            const { data } = await _supabase.from('branches').select('*').order('name');
            const select = document.getElementById('service-branch');
            if (data && data.length > 0) {
                select.innerHTML = '<option value="">Select a branch</option>' +
                    data.map(b => `<option value="${b.name}">${b.name} (${b.address})</option>`).join('');
            } else {
                select.innerHTML = '<option value="">No branches available</option>';
            }
        }

        // 2. Fetch Jobs for this specific user
        async function fetchJobs() {
            const appointContainer = document.getElementById('appointments-container');
            const historyContainer = document.getElementById('history-container');

            const { data: jobs, error } = await _supabase
                .from('bookings')
                .select('*')
                .eq('client_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                appointContainer.innerHTML = `<p class="text-red-500">Error loading data.</p>`;
                return;
            }

            const activeJobs = jobs.filter(j => ['pending', 'confirmed'].includes(j.status));
            const pastJobs = jobs.filter(j => ['completed', 'reviewed', 'rejected'].includes(j.status));

            document.getElementById('appointment-count').innerText = `${activeJobs.length} Active`;
            document.getElementById('history-count').innerText = `${pastJobs.length} Completed`;

            // Render Active Appointments
            if (activeJobs.length === 0) {
                appointContainer.innerHTML = `<p class="p-8 text-center text-slate-400 italic text-sm">No active appointments.</p>`;
            } else {
                appointContainer.innerHTML = activeJobs.map(j => renderJobCard(j)).join('');
            }

            // Render Past History
            if (pastJobs.length === 0) {
                historyContainer.innerHTML = `<p class="p-8 text-center text-slate-400 italic text-sm">No service history.</p>`;
            } else {
                historyContainer.innerHTML = pastJobs.map(j => renderJobCard(j)).join('');
            }
        }

        function renderJobCard(job) {
            return `
                <div class="p-6 border border-slate-100 rounded-2xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800">${job.service_type}</span>
                            <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded ${job.status === 'completed' ? 'bg-green-100 text-green-700' :
                    job.status === 'reviewed' ? 'bg-purple-100 text-purple-700' :
                        'bg-blue-100 text-blue-600'
                }">${job.status || 'pending'}</span>
                        </div>
                        <p class="text-sm text-slate-500">${job.description}</p>
                        
                        <!-- Mini Status Tracker -->
                        <div class="mt-4 mb-4">
                            <div class="flex items-center justify-between max-w-[280px] relative">
                                <div class="absolute top-1/2 left-0 w-full h-0.5 bg-slate-200 -translate-y-1/2 z-0"></div>
                                <div class="absolute top-1/2 left-0 h-0.5 bg-blue-500 -translate-y-1/2 z-0 transition-all duration-700" style="width: ${job.status === 'confirmed' ? '50%' :
                    (job.status === 'completed' || job.status === 'reviewed') ? '100%' : '0%'
                }; opacity: ${job.status === 'rejected' ? '0' : '1'}"></div>

                                <div class="relative z-10 flex flex-col items-center">
                                    <div class="w-3 h-3 rounded-full ${job.status !== 'rejected' ? 'bg-blue-500 ring-4 ring-blue-50' : 'bg-red-500 ring-4 ring-red-50'} shadow-sm"></div>
                                    <span class="text-[8px] font-black mt-2 text-slate-400 uppercase tracking-tighter">Request</span>
                                </div>
                                <div class="relative z-10 flex flex-col items-center">
                                    <div class="w-3 h-3 rounded-full ${['confirmed', 'completed', 'reviewed'].includes(job.status) ? 'bg-blue-500 ring-4 ring-blue-50' : 'bg-slate-200'} shadow-sm"></div>
                                    <span class="text-[8px] font-black mt-2 text-slate-400 uppercase tracking-tighter">Approved</span>
                                </div>
                                <div class="relative z-10 flex flex-col items-center">
                                    <div class="w-3 h-3 rounded-full ${['completed', 'reviewed'].includes(job.status) ? 'bg-blue-500 ring-4 ring-blue-50' : 'bg-slate-200'} shadow-sm"></div>
                                    <span class="text-[8px] font-black mt-2 text-slate-400 uppercase tracking-tighter">Done</span>
                                </div>
                            </div>
                            ${job.status === 'rejected' ? '<p class="text-[9px] font-bold text-red-500 mt-1 uppercase">Disapproved by Admin</p>' : ''}
                        </div>
                        ${job.photo_url ? `
                            <div class="mt-3 flex flex-wrap gap-2">
                                ${(function () {
                        try {
                            const parsed = JSON.parse(job.photo_url || '[]');
                            const urls = Array.isArray(parsed) ? parsed : [job.photo_url];
                            return urls.map(url => `
                                            <img src="${url}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 cursor-pointer hover:border-blue-500 transition" onclick="openLightbox('${url}')" />
                                        `).join('');
                        } catch (e) {
                            return `<img src="${job.photo_url}" class="w-16 h-16 object-cover rounded-xl border border-slate-200 cursor-pointer hover:border-blue-500 transition" onclick="openLightbox('${job.photo_url}')" />`;
                        }
                    })()}
                            </div>
                        ` : ''}
                        <p class="text-[10px] text-slate-400 mt-2">
                            <span>Branch: ${job.branch_name || 'N/A'}</span> | 
                            <span>Address: ${job.address || 'N/A'}</span> | 
                            <span>Scheduled: ${job.booking_date ? new Date(job.booking_date).toLocaleString() : 'N/A'}</span>
                        </p>
                    </div>
                    ${job.status === 'completed' ? `
                        <button onclick="openReviewModal('${job.id}', '${job.service_type}')" 
                                class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-black px-6 py-3 rounded-xl shadow-md transition transform hover:-translate-y-1 whitespace-nowrap">
                            Leave Review
                        </button>
                    ` : ''}
                </div>`;
        }

        // Fetch Profile

        async function fetchProfile() {
            const { data: profile, error } = await _supabase
                .from('profiles')
                .select('address, mobile, age')
                .eq('id', currentUser.id)
                .single();
            const infoDiv = document.getElementById('profile-info');
            if (error) {
                console.error('Profile fetch error:', error);
                infoDiv.innerText = 'Unable to load profile details.';
            } else {
                const address = profile.address || 'N/A';
                const mobile = profile.mobile || 'N/A';
                const age = profile.age !== null && profile.age !== undefined ? profile.age : 'N/A';
                infoDiv.innerText = `Address: ${address} | Mobile: ${mobile} | Age: ${age}`;
            }
        }

        // Submit New Request
        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const type = document.getElementById('service-type').value;
            const desc = document.getElementById('service-desc').value;
            const branch = document.getElementById('service-branch').value;
            const address = document.getElementById('service-address').value;
            const datetime = document.getElementById('service-datetime').value;
            const photoFiles = document.getElementById('service-photo').files;

            if (!branch) return alert("Please select a branch.");

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                let photoUrls = [];

                // 1. Upload Photos if selected
                if (photoFiles.length > 0) {
                    for (const file of photoFiles) {
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Math.random()}.${fileExt}`;
                        const filePath = `${currentUser.id}/${fileName}`;

                        const { error: uploadError } = await _supabase.storage
                            .from('photos')
                            .upload(filePath, file);

                        if (uploadError) throw new Error(`Upload failed for ${file.name}: ${uploadError.message}`);

                        const { data: { publicUrl } } = _supabase.storage
                            .from('photos')
                            .getPublicUrl(filePath);

                        photoUrls.push(publicUrl);
                    }
                }

                // 2. Insert Booking (Store photoUrls as JSON string)
                const { error: insertError } = await _supabase.from('bookings').insert([
                    {
                        client_id: currentUser.id,
                        service_type: type,
                        description: desc,
                        branch_name: branch,
                        address: address,
                        booking_date: datetime,
                        photo_url: photoUrls.length > 0 ? JSON.stringify(photoUrls) : null,
                        status: 'pending'
                    }
                ]);

                if (insertError) throw insertError;

                alert("Booking request sent successfully!");
                document.getElementById('request-form').reset();
                fetchJobs();

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Request";
            }
        });

        async function submitReview(bookingId) {
            const rating = document.getElementById('review-rating').value;
            const text = document.getElementById('review-text').value;
            const photoFiles = document.getElementById('review-photos').files;
            const btn = event.target;

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                let photoUrls = [];
                if (photoFiles.length > 0) {
                    for (const file of photoFiles) {
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Math.random()}.${fileExt}`;
                        const filePath = `reviews/${currentUser.id}/${fileName}`;

                        const { error: uploadError } = await _supabase.storage
                            .from('photos')
                            .upload(filePath, file);

                        if (uploadError) throw uploadError;

                        const { data: { publicUrl } } = _supabase.storage
                            .from('photos')
                            .getPublicUrl(filePath);

                        photoUrls.push(publicUrl);
                    }
                }

                const { error: reviewError } = await _supabase.from('reviews').insert([{
                    booking_id: bookingId,
                    client_id: currentUser.id,
                    rating: parseInt(rating),
                    comment: text,
                    photo_urls: photoUrls.length > 0 ? JSON.stringify(photoUrls) : null
                }]);

                if (reviewError) throw reviewError;

                await _supabase.from('bookings').update({ status: 'reviewed' }).eq('id', bookingId);
                closeReviewModal();
                fetchJobs();
                alert("Thank you for your feedback!");
            } catch (err) {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Submit";
            }
        }

        function setRating(val) {
            document.getElementById('review-rating').value = val;
            const stars = document.getElementById('star-rating-container').children;
            for (let i = 0; i < 5; i++) {
                stars[i].classList.toggle('text-yellow-400', i < val);
                stars[i].classList.toggle('text-slate-200', i >= val);
            }
        }

        function openReviewModal(bookingId, serviceType) {
            const modal = document.createElement('div');
            modal.id = "review-modal";
            modal.className = "fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl animate-in fade-in zoom-in duration-300">
                    <h3 class="text-2xl font-black mb-2">Service Review</h3>
                    <p class="text-slate-500 text-sm mb-6">How was your experience with <b>${serviceType}</b>?</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Rating</label>
                            <div class="flex gap-2 text-3xl" id="star-rating-container">
                                <span class="cursor-pointer text-yellow-400 hover:scale-110 transition" onclick="setRating(1)">★</span>
                                <span class="cursor-pointer text-yellow-400 hover:scale-110 transition" onclick="setRating(2)">★</span>
                                <span class="cursor-pointer text-yellow-400 hover:scale-110 transition" onclick="setRating(3)">★</span>
                                <span class="cursor-pointer text-yellow-400 hover:scale-110 transition" onclick="setRating(4)">★</span>
                                <span class="cursor-pointer text-yellow-400 hover:scale-110 transition" onclick="setRating(5)">★</span>
                            </div>
                            <input type="hidden" id="review-rating" value="5" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Your Feedback</label>
                            <textarea id="review-text" rows="3" placeholder="Tell us what you think..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Photos (Optional)</label>
                            <input type="file" id="review-photos" multiple accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button onclick="closeReviewModal()" class="flex-1 px-6 py-4 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition">Cancel</button>
                            <button onclick="submitReview('${bookingId}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1">Submit</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeReviewModal() {
            const modal = document.getElementById('review-modal');
            if (modal) modal.remove();
        }

        function openLightbox(src) {
            // Basic lightbox implementation
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 cursor-pointer";
            modal.innerHTML = `<img src="${src}" class="max-w-full max-h-full rounded-lg shadow-2xl" />`;
            modal.onclick = () => document.body.removeChild(modal);
            document.body.appendChild(modal);
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        checkSession();
    </script>
</body>

</html>
